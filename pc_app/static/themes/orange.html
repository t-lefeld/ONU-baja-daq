<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telemetry — Orange</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23161616'/%3E%3Ctext x='32' y='46' font-size='38' font-family='Arial' font-weight='900' text-anchor='middle' fill='%23ff6a00'%3ET%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg:      #161616;
  --panel:   #1f1f1f;
  --fg:      #f5f2ee;
  --muted:   #9a938b;
  --border:  #33302c;
  --accent:  #ff6a00;
  --accent2: #ffb100;
  --ok:      #7ed957;
  --warn:    #ffb100;
  --bad:     #ff4d4d;
  --font:    "Arial Black", "Helvetica Neue", Arial, sans-serif;
  --mono:    ui-monospace, "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 Arial, sans-serif; }
a { color: inherit; text-decoration: none; }

.shell { display: flex; min-height: 100vh; }

/* ---- left vertical tab rail: theme nav lives here ---- */
.rail {
  width: 88px; flex: none; background: #111;
  border-right: 4px solid var(--accent);
  display: flex; flex-direction: column; align-items: stretch;
  padding-top: 18px;
}
.rail .mark {
  color: var(--accent); font: 900 22px var(--font); text-align: center;
  padding-bottom: 16px; letter-spacing: -0.03em;
}
.rail a {
  display: block; text-align: center; padding: 14px 4px; font-size: 11px;
  font-weight: 800; text-transform: uppercase; letter-spacing: .04em;
  color: var(--muted); border-left: 4px solid transparent;
}
.rail a:hover { color: var(--fg); }
.rail a.active { color: var(--accent); border-left-color: var(--accent); background: #1a1a1a; }

.content { flex: 1; min-width: 0; }

header.bar {
  display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center;
  padding: 18px 24px; border-bottom: 4px solid var(--accent); background: var(--panel);
}
header.bar h1 {
  font: 900 24px var(--font); margin: 0 16px 0 0; text-transform: uppercase;
  letter-spacing: -0.02em; color: var(--accent);
}
.stat { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; }
.stat b { color: var(--fg); font-weight: 900; font-family: var(--mono); text-transform: none; }

.link { font-size: 12px; font-weight: 900; text-transform: uppercase; padding: 4px 10px; }
.link.live    { color: #111; background: var(--ok); }
.link.waiting { color: #111; background: var(--warn); }
.link.error,
.link.down    { color: #fff; background: var(--bad); }
.link.na      { color: var(--muted); background: #2a2a2a; }

main {
  display: grid; gap: 4px; padding: 4px;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
}

.node {
  background: var(--panel); border: 3px solid #2a2a2a;
}
.node.stale { opacity: .4; }

.node-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 18px; background: #262019; border-bottom: 3px solid var(--accent);
}
.node-title { font: 900 15px var(--font); text-transform: uppercase; }
.node-title span { color: var(--muted); font-weight: 700; font-size: 11px; margin-left: 8px; text-transform: none; }
.node-state { font-size: 11px; font-weight: 900; text-transform: uppercase; }

.chan { padding: 14px 18px; border-top: 2px solid #2a2a2a; }
.chan:first-of-type { border-top: none; }
.chan-row { display: flex; justify-content: space-between; align-items: baseline; }
.chan-name { font-size: 12px; color: var(--muted); font-weight: 800; text-transform: uppercase; }
.chan-value { font-family: var(--mono); font-size: 24px; font-weight: 700; color: var(--accent2); }
.chan-unit { font-size: 11px; color: var(--muted); margin-left: 4px; }
.spark { display: block; width: 100%; height: 30px; margin-top: 6px; }

footer { padding: 10px 24px 24px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="shell">
  <nav class="rail">
    <div class="mark">T</div>
    <a href="modern.html">Modern</a>
    <a href="orange.html" class="active">Orange</a>
    <a href="cyan.html">Cyan</a>
    <a href="black.html">Black</a>
    <a href="white.html">White</a>
    <a href="../index.html">Gallery</a>
  </nav>

  <div class="content">
    <header class="bar">
      <h1>Telemetry</h1>
      <span id="link" class="link na">connecting</span>
      <span class="stat">source <b id="source">-</b></span>
      <span class="stat">frames <b id="frames">0</b></span>
      <span class="stat">rate <b id="rate">-</b></span>
      <span class="stat">last <b id="age">-</b></span>
      <span class="stat">can loss <b id="loss">0</b></span>
      <span class="stat">crc err <b id="crc">0</b></span>
    </header>

    <main id="nodes"></main>
    <footer id="detail"></footer>
  </div>
</div>

<script src="../js/telemetry-core.js"></script>
<script>
"use strict";
const T = window.TelemetryCore;
const el = id => document.getElementById(id);
const ui = {
  link: el("link"), source: el("source"), frames: el("frames"),
  rate: el("rate"), age: el("age"), loss: el("loss"), crc: el("crc"),
  nodes: el("nodes"), detail: el("detail"),
};

let panels = [];
let meta = null;
let frameCount = 0;
let totalLoss = 0;
let lastFrameAt = 0;
const rate = T.makeRateTracker();

function buildPanels(m) {
  ui.nodes.innerHTML = "";
  panels = [];
  for (const node of m.nodes) {
    const root = document.createElement("section");
    root.className = "node stale";
    const head = document.createElement("div");
    head.className = "node-head";
    head.innerHTML = `<div class="node-title">${node.label}<span>node ${node.node_id}</span></div>`;
    const state = document.createElement("span");
    state.className = "node-state";
    state.textContent = "waiting";
    head.appendChild(state);
    root.appendChild(head);

    const chans = [];
    for (const ch of node.channels) {
      const wrap = document.createElement("div");
      wrap.className = "chan";
      const row = document.createElement("div");
      row.className = "chan-row";
      row.innerHTML = `<span class="chan-name">${ch.name}</span>`;
      const value = document.createElement("span");
      value.className = "chan-value";
      value.innerHTML = `--<span class="chan-unit">${ch.unit}</span>`;
      row.appendChild(value);
      wrap.appendChild(row);
      const canvas = document.createElement("canvas");
      canvas.className = "spark";
      wrap.appendChild(canvas);
      root.appendChild(wrap);
      chans.push({ value, canvas, unit: ch.unit, data: [] });
    }
    ui.nodes.appendChild(root);
    panels.push({ root, state, chans });
  }
}

function accentColor() {
  return getComputedStyle(document.documentElement).getPropertyValue("--accent2").trim() || "#ffb100";
}

function applyFrame(frame, redraw) {
  frameCount++;
  lastFrameAt = performance.now();
  rate.hit();

  for (const rec of frame.nodes) {
    const panel = panels[rec.node_id];
    if (!panel) continue;
    totalLoss += rec.loss;
    panel.root.classList.toggle("stale", rec.stale);

    if (rec.stale) { panel.state.textContent = "OFFLINE"; panel.state.style.color = "var(--bad)"; }
    else if (rec.fault) { panel.state.textContent = "SENSOR FAULT"; panel.state.style.color = "var(--warn)"; }
    else { panel.state.textContent = rec.loss ? `${rec.loss} LOST` : "LIVE"; panel.state.style.color = "var(--ok)"; }

    rec.channels.forEach((ch, i) => {
      const slot = panel.chans[i];
      if (!slot) return;
      slot.data.push(ch.value);
      if (slot.data.length > T.HISTORY) slot.data.shift();
      if (redraw) {
        slot.value.innerHTML = `${T.fmt(ch.value)}<span class="chan-unit">${ch.unit}</span>`;
        T.drawSpark(slot.canvas, slot.data, accentColor());
      }
    });
  }

  if (redraw) {
    ui.frames.textContent = frameCount;
    ui.loss.textContent = totalLoss;
    const hz = rate.hz();
    if (hz) ui.rate.textContent = hz.toFixed(2) + " Hz";
  }
}

function applyStatus(s) {
  ui.source.textContent = s.source || "-";
  ui.crc.textContent = s.crc_errors ?? 0;
  ui.link.className = "link " + (s.link || "na").replace("/", "");
  ui.link.textContent = s.link || "-";
  ui.detail.textContent = s.error ? `error: ${s.error}` : (s.detail || "");
}

function tickAge() {
  if (!lastFrameAt) return;
  const age = (performance.now() - lastFrameAt) / 1000;
  ui.age.textContent = age.toFixed(1) + "s";
  const limit = meta ? meta.frame_period_ms / 1000 * 3 : 2;
  ui.age.style.color = age > limit ? "var(--bad)" : "";
}
setInterval(tickAge, 200);

T.connect({
  onMeta: (m) => { meta = m; buildPanels(m); },
  onStatus: applyStatus,
  onFrame: applyFrame,
  onClose: () => {
    ui.link.className = "link down";
    ui.link.textContent = "APP NOT RUNNING";
    ui.detail.textContent = "lost connection to the ground station";
  },
});

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    panels.forEach(p => p.chans.forEach(c => T.drawSpark(c.canvas, c.data, accentColor())));
  }, 120);
});
</script>
</body>
</html>

; PlatformIO project file for the 3rd Bluepill (NODE_ID 2, Motion).
; Identical to 1st/2nd Bluepill - the only source difference between the
; three nodes is Core/Inc/node_id.h.
;
; See 1st Bluepill/platformio.ini for why Drivers/, Core/Startup, and
; Core/Src/system_stm32f1xx.c are excluded here - PlatformIO's stm32cube
; framework always builds its own copies of those, and mixing both causes
; "multiple definition" link errors.

[platformio]
src_dir = .

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube

upload_protocol = blackmagic
debug_tool = blackmagic
upload_port = COM6

build_flags =
    -I Core/Inc
    -D STM32F103xB
    -D USE_HAL_DRIVER

build_src_filter =
    +<Core/Src/>
    -<Core/Src/system_stm32f1xx.c>

board_build.ldscript = STM32F103C8TX_FLASH.ld

; PlatformIO project file for the 1st Bluepill (NODE_ID 0, Environmental).
; Identical for 2nd/3rd Bluepill except env name/board comment - the actual
; source difference between the three nodes is only Core/Inc/node_id.h.
;
; IMPORTANT: PlatformIO's `framework = stm32cube` unconditionally builds its
; own bundled copy of the HAL driver, CMSIS device files, and startup file as
; separate "Framework" static libraries - this happens regardless of
; build_src_filter. So this project does NOT vendor its own copy of
; Drivers/STM32F1xx_HAL_Driver, Drivers/CMSIS, or Core/Startup for the
; PlatformIO build (those still exist on disk for the CubeIDE build, just
; excluded here) - only this project's own application code and Core/Inc
; headers (including our own stm32f1xx_hal_conf.h, which correctly overrides
; the framework's generic template because Core/Inc is first on the include
; path). Mixing both copies causes "multiple definition of HAL_Init" etc.

[platformio]
src_dir = .

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube

; --- Black Magic Probe native routing ---
upload_protocol = blackmagic
debug_tool = blackmagic
; BMP enumerates as TWO ports: the first is the GDB server, the second is a
; plain UART passthrough. Point this at the FIRST one. Update per your OS/port.
upload_port = COM6

; --- Only our own headers; HAL/CMSIS headers come from the framework package ---
build_flags =
    -I Core/Inc
    -D STM32F103xB
    -D USE_HAL_DRIVER

; Only our own application source. system_stm32f1xx.c and the startup file
; are excluded because the framework already supplies matching versions of
; both (SystemInit and the vector table); our real clock setup lives in
; SystemClock_Config() inside main.c, which is ours either way.
build_src_filter =
    +<Core/Src/>
    -<Core/Src/system_stm32f1xx.c>

; Use this project's own linker script rather than PlatformIO's generic default.
board_build.ldscript = STM32F103C8TX_FLASH.ld

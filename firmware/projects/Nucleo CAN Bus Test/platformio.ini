; PlatformIO project file for the Nucleo-L476RG hub.
;
; v1's telemetry_hub.c is EXCLUDED from this build below: it and
; telemetry_hub_v2.c both define a strong HAL_CAN_RxFifo0MsgPendingCallback,
; so linking both is a duplicate-symbol error - same reasoning as the
; .cproject exclusion for the CubeIDE build, just needed separately here
; since build_src_filter compiles every file under Core/Src/ on its own,
; ignoring .cproject entirely.
;
; See firmware/projects/1st Bluepill/platformio.ini for the full explanation:
; PlatformIO's stm32cube framework always builds its own copies of the HAL
; driver, CMSIS device files, and startup file, regardless of
; build_src_filter. So this project only supplies its own application code
; and Core/Inc headers (including our own stm32l4xx_hal_conf.h) - the vendored
; Drivers/STM32L4xx_HAL_Driver, Drivers/CMSIS, Core/Startup, and
; Core/Src/system_stm32l4xx.c are excluded from this build (they still exist
; on disk for the CubeIDE build, just not used here).

[platformio]
src_dir = .

[env:nucleo_l476rg]
platform = ststm32
board = nucleo_l476rg
framework = stm32cube

; Uses the Nucleo's own onboard ST-Link (built into the board, over its
; regular USB port) instead of the Black Magic Probe - no external wiring
; needed for this board, and no upload_port either: ST-Link is accessed as a
; USB HID/WinUSB device, not a COM/serial port.
upload_protocol = stlink
debug_tool = stlink

; The hub mirrors every frame as text on USART2 -> the ST-Link's Virtual COM
; Port - a SEPARATE COM port from ST-Link's own programming interface. Check
; Device Manager for "STMicroelectronics STLink Virtual COM Port" and set
; monitor_port below to match; PlatformIO can usually auto-detect it if left
; unset, but setting it explicitly avoids picking the wrong device.
monitor_speed = 115200
; monitor_port = COM7   ; uncomment and set if auto-detect picks the wrong port

build_flags =
    -I Core/Inc
    -D STM32L476xx
    -D USE_HAL_DRIVER

build_src_filter =
    +<Core/Src/>
    -<Core/Src/system_stm32l4xx.c>
    -<Core/Src/telemetry_hub.c>

board_build.ldscript = STM32L476RGTX_FLASH.ld
